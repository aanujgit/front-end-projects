<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gym Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

body{
    background:linear-gradient(135deg,#141e30,#243b55);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:white;
    padding:40px;
    border-radius:20px;
    width:400px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h2{
    text-align:center;
    margin-bottom:25px;
}

</style>

</head>

<body>

<div class="login-box">

<h2>FITZONE LOGIN</h2>

<select id="role"
        class="form-control mb-3">

    <option value="">
        Select Role
    </option>

    <option value="user">
        Member
    </option>

    <option value="trainer">
        Trainer
    </option>

    <option value="admin">
        Owner/Admin
    </option>

</select>

<input type="text"
       id="username"
       placeholder="Username"
       class="form-control mb-3">

<input type="password"
       id="password"
       placeholder="Password"
       class="form-control mb-3">

<button onclick="login()"
        class="btn btn-primary w-100">

    Login

</button>

</div>

<script>

function login(){

    let role =
    document.getElementById("role").value;

    if(role=="user"){
        window.location.href =
        "user-dashboard.html";
    }

    else if(role=="trainer"){
        window.location.href =
        "trainer-dashboard.html";
    }

    else if(role=="admin"){
        window.location.href =
        "admin-dashboard.html";
    }

    else{
        alert("Please select role");
    }
}

</script>

</body>
</html>
